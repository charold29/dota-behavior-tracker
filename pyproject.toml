[project]
name = "dota-behavior-tracker"
description = "Keeps a local history of your Dota 2 Behavior Score"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
]

[project.scripts]
dota-behavior = "dota_behavior_tracker.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
